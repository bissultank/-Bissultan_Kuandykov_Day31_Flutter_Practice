name: movie_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # HTTP
  dio: ^5.7.0

  # Service locator
  get_it: ^8.0.2

  # Image caching
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Equatable for value equality in Bloc
  equatable: ^2.0.5

  # Local DB (favorites)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
